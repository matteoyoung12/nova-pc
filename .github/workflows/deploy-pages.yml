name: Publish NOVA PC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Собрать сайт для GitHub Pages
        run: npm run build
        env:
          VITE_GITHUB_PAGES: 'true'
      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
