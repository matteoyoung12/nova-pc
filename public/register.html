<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Регистрация — Сборка ПК</title
  ><link rel="stylesheet" href="/css/app.css" />
  <main class="auth card">
    <a class="brand" href="/">Сборка ПК</a>
    <h1>Создать аккаунт</h1>
    <form id="auth-form">
      <label>Имя<input name="name" maxlength="60" required /></label
      ><label>Email<input name="email" type="email" required /></label
      ><label
        >Пароль<input
          name="password"
          type="password"
          minlength="8"
          maxlength="128"
          required
      /></label>
      <p class="error" id="error" aria-live="polite"></p>
      <button class="primary">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="/login.html">Войти</a></p>
  </main>
  <script type="module" src="/js/auth.js"></script>
</html>
